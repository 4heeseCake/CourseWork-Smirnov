name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run install:all
      - run: npm run ci
      - name: Build and start three containers
        run: docker compose up -d --build --wait
      - name: Check public entry points and session proxy
        run: npm run smoke
      - name: Check backend port isolation
        run: |
          test -z "$(docker compose port backend 8000)"
          docker compose exec -T attacker node -e "require('dns').lookup('backend',e=>process.exit(e?0:1))"
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Cleanup
        if: always()
        run: docker compose down --volumes
